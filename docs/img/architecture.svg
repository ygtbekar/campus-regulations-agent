<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; rx: 10; }
    .accent { fill: #f6f8fa; stroke: #d0d7de; }
    .guard { fill: #fff8e6; stroke: #d4a72c; }
    .source { fill: #eef6ff; stroke: #54aeff; }
    .title { font-size: 14px; font-weight: 650; fill: #1f2328; }
    .body  { font-size: 11.5px; fill: #59636e; }
    .mono  { font-size: 11px; fill: #59636e; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .label { font-size: 10.5px; fill: #6e7781; }
    .flow  { stroke: #8c959f; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .flow-back { stroke: #d4a72c; stroke-width: 1.6; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrow-warn); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .accent { fill: #1c2128; stroke: #30363d; }
      .guard { fill: #2b2412; stroke: #9e6a03; }
      .source { fill: #121d2f; stroke: #1f6feb; }
      .title { fill: #e6edf3; }
      .body, .mono, .label { fill: #9198a1; }
      .flow { stroke: #6e7681; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d4a72c"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="880" height="470"/>

  <!-- question -->
  <rect class="card accent" x="24" y="28" width="196" height="58" rx="10"/>
  <text class="title" x="40" y="52">Student question</text>
  <text class="body" x="40" y="72">Turkish or English</text>

  <!-- agent loop -->
  <rect class="card" x="24" y="120" width="196" height="150" rx="10"/>
  <text class="title" x="40" y="146">Agent loop</text>
  <text class="mono" x="40" y="166">agent.py</text>
  <text class="body" x="40" y="190">call the model</text>
  <text class="body" x="40" y="208">run the tools it asks for</text>
  <text class="body" x="40" y="226">feed results back, repeat</text>
  <text class="label" x="40" y="252">step limit + graceful fallback</text>

  <!-- tools -->
  <rect class="card source" x="288" y="112" width="252" height="70" rx="10"/>
  <text class="title" x="304" y="136">search_regulations</text>
  <text class="body" x="304" y="156">semantic search over the regulation</text>
  <text class="mono" x="304" y="173">retrieval.py · Chroma</text>

  <rect class="card" x="288" y="198" width="252" height="66" rx="10"/>
  <text class="title" x="304" y="222">calculate_gpa · days_until</text>
  <text class="body" x="304" y="242">deterministic Python, never the model</text>
  <text class="mono" x="304" y="258">tools.py</text>

  <!-- corpus -->
  <rect class="card accent" x="608" y="112" width="248" height="152" rx="10"/>
  <text class="title" x="624" y="136">Official regulation (2026)</text>
  <text class="body" x="624" y="158">47 articles × 2 languages</text>
  <text class="body" x="624" y="176">= 94 chunks, one per article</text>
  <text class="body" x="624" y="200">embedded with</text>
  <text class="mono" x="624" y="217">llama-nemotron-embed-vl-1b-v2</text>
  <text class="label" x="624" y="241">URL + date + SHA-256 recorded</text>
  <text class="label" x="624" y="256">hit@4 100% on the eval set</text>

  <!-- answer -->
  <rect class="card" x="288" y="300" width="252" height="74" rx="10"/>
  <text class="title" x="304" y="324">Answer as JSON</text>
  <text class="mono" x="304" y="344">{ answer, sources }</text>
  <text class="body" x="304" y="363">sources = articles actually used</text>

  <!-- validation -->
  <rect class="card guard" x="288" y="392" width="252" height="58" rx="10"/>
  <text class="title" x="304" y="414">Validation</text>
  <text class="body" x="304" y="434">schema · real article · retrieved · script</text>

  <!-- output -->
  <rect class="card accent" x="608" y="330" width="248" height="90" rx="10"/>
  <text class="title" x="624" y="354">Answer + citation</text>
  <text class="body" x="624" y="376">or: “I could not find this</text>
  <text class="body" x="624" y="393">in the regulation”</text>
  <text class="label" x="624" y="412">a forged citation never reaches here</text>

  <!-- flows -->
  <path class="flow" d="M 122 86 L 122 118"/>
  <path class="flow" d="M 220 160 L 286 147"/>
  <path class="flow" d="M 220 196 L 286 224"/>
  <path class="flow" d="M 540 147 L 606 160"/>
  <path class="flow" d="M 122 270 L 122 337 L 286 337"/>
  <path class="flow" d="M 414 374 L 414 390"/>
  <path class="flow" d="M 540 421 L 574 421 L 574 375 L 606 375"/>
  <path class="flow-back" d="M 288 421 L 250 421 L 250 300 L 122 300 L 122 272"/>
  <text class="label" x="128" y="292">invalid → retry with the error</text>
  <text class="label" x="232" y="140">tool call</text>
  <text class="label" x="556" y="140">vector search</text>
</svg>
